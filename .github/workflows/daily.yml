name: Daily GitHub Trending

on:
  schedule:
    - cron: '0 16 * * *'  # 每天北京时间 0 点执行 (UTC 16:00)
  workflow_dispatch:  # 允许手动执行
    inputs:
      provider:
        description: '选择模型提供商'
        required: true
        default: 'deepseek'
        type: choice
        options:
          - deepseek
          - opencode-zen
          - cursor
          - sub2api
      model:
        description: '模型名称（可选，留空使用各提供商默认模型，sub2api 建议填写）'
        required: false
        default: ''
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          if [ "${{ github.event.inputs.provider || 'deepseek' }}" = "cursor" ]; then
            echo "安装 cursor-sdk..."
            pip install cursor-sdk
          fi

      - name: Validate required secrets
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENCODE_ZEN_API_KEY: ${{ secrets.OPENCODE_ZEN_API_KEY }}
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          SUB2API_API_KEY: ${{ secrets.SUB2API_API_KEY }}
          SUB2API_API_URL: ${{ secrets.SUB2API_API_URL }}
          HALO_TOKEN: ${{ secrets.HALO_TOKEN }}
          MODEL_PROVIDER: ${{ github.event.inputs.provider || 'deepseek' }}
        run: |
          echo "=== 验证必需的 Secrets ==="
          echo "模型提供商: $MODEL_PROVIDER"
          missing=0
          if [ "$MODEL_PROVIDER" = "opencode-zen" ]; then
            if [ -z "$OPENCODE_ZEN_API_KEY" ]; then
              echo "❌ 缺少 OPENCODE_ZEN_API_KEY secret"
              missing=1
            else
              echo "✅ OPENCODE_ZEN_API_KEY 已配置 (长度: ${#OPENCODE_ZEN_API_KEY})"
            fi
          elif [ "$MODEL_PROVIDER" = "cursor" ]; then
            if [ -z "$CURSOR_API_KEY" ]; then
              echo "❌ 缺少 CURSOR_API_KEY secret"
              missing=1
            else
              echo "✅ CURSOR_API_KEY 已配置 (长度: ${#CURSOR_API_KEY})"
            fi
          elif [ "$MODEL_PROVIDER" = "sub2api" ]; then
            if [ -z "$SUB2API_API_KEY" ]; then
              echo "❌ 缺少 SUB2API_API_KEY secret"
              missing=1
            else
              echo "✅ SUB2API_API_KEY 已配置 (长度: ${#SUB2API_API_KEY})"
            fi
            if [ -z "$SUB2API_API_URL" ]; then
              echo "❌ 缺少 SUB2API_API_URL secret"
              echo "请设置为你的 Sub2API 站点地址，如 https://your-domain.com/v1/chat/completions"
              missing=1
            else
              echo "✅ SUB2API_API_URL 已配置"
            fi
          else
            if [ -z "$DEEPSEEK_API_KEY" ]; then
              echo "❌ 缺少 DEEPSEEK_API_KEY secret"
              missing=1
            else
              echo "✅ DEEPSEEK_API_KEY 已配置 (长度: ${#DEEPSEEK_API_KEY})"
            fi
          fi
          if [ -z "$HALO_TOKEN" ]; then
            echo "❌ 缺少 HALO_TOKEN secret"
            missing=1
          else
            echo "✅ HALO_TOKEN 已配置 (长度: ${#HALO_TOKEN})"
          fi
          if [ "$missing" = "1" ]; then
            echo "请前往 Settings → Secrets and variables → Actions 配置缺失的 secrets"
            exit 1
          fi

      - name: Get trending repo and update CSV (local only)
        id: get_trending
        run: |
          echo "=== 获取趋势仓库（CSV 仅在本地更新，提交留到发布成功后） ==="
          python github_daily.py

          if [ -f processed_repos.csv ]; then
            echo "CSV 文件大小: $(wc -c < processed_repos.csv) 字节"
          else
            echo "错误: CSV 文件未创建"
            exit 1
          fi

      - name: Generate blog post
        id: generate_post
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENCODE_ZEN_API_KEY: ${{ secrets.OPENCODE_ZEN_API_KEY }}
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          SUB2API_API_KEY: ${{ secrets.SUB2API_API_KEY }}
          SUB2API_API_URL: ${{ secrets.SUB2API_API_URL }}
          MODEL_PROVIDER: ${{ github.event.inputs.provider || 'deepseek' }}
          MODEL_NAME: ${{ github.event.inputs.model || '' }}
        run: |
          echo "=== 生成博客文章 (提供商: ${MODEL_PROVIDER:-deepseek}) ==="
          python generate_post.py
          if [ -f generated_post.json ]; then
            echo "文章生成成功"
          else
            echo "错误: 文章生成失败"
            exit 1
          fi

      - name: Publish to Halo
        id: publish
        env:
          HALO_TOKEN: ${{ secrets.HALO_TOKEN }}
        run: |
          echo "=== 发布到 Halo ==="
          python publish_to_halo.py

      # 关键：CSV 与中间产物在发布成功后才提交，发布失败时本次改动会被丢弃，
      # 下次运行仍会重新处理同一个仓库（避免「标记了但没发布」的丢稿问题）。
      - name: Commit changes after successful publish
        run: |
          echo "=== 提交本次运行产生的更改 ==="
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          # 只添加本次运行产生的已知文件，避免误提交 .env 等敏感文件
          git add processed_repos.csv generated_post.json github_daily.json 2>/dev/null || true

          if git diff --staged --quiet; then
            echo "没有需要提交的更改"
          else
            echo "提交更改..."
            git commit -m "Auto-update: daily trending post [skip ci]"
            git push origin ${{ github.ref_name }}
            echo "更改已提交到 ${{ github.ref_name }}"
          fi

      - name: Push to gh-pages
        run: |
          echo "=== 更新 gh-pages 分支 ==="
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          if [ ! -f github_daily.json ]; then
            echo "错误: github_daily.json 文件不存在"
            exit 1
          fi

          # 备份要发布的文件到 /tmp（切换分支会清空工作区）
          cp github_daily.json /tmp/trending_data.json

          # 拉取远程 gh-pages 分支（首次运行时不存在）
          git fetch origin gh-pages 2>/dev/null || echo "首次运行，远程 gh-pages 不存在"

          if git show-ref --verify --quiet refs/remotes/origin/gh-pages; then
            # 分支已存在，切换过去并保留远程上已有的文件（不覆盖历史）
            echo "远程 gh-pages 已存在，切换并保留已有文件"
            git checkout -B gh-pages origin/gh-pages
          else
            # 首次创建 orphan 分支（不带历史）
            echo "远程 gh-pages 不存在，创建 orphan 分支"
            git checkout --orphan gh-pages
          fi

          # 写入 index.json
          cp /tmp/trending_data.json index.json
          git add index.json

          if git diff --staged --quiet; then
            echo "index.json 无变化，跳过推送"
          else
            git commit -m "Update daily trending data [skip ci]"
            # 不使用 --force：分支已存在则正常 push，orphan 分支首次 push 会自动创建
            git push origin gh-pages
            echo "gh-pages 分支已更新"
          fi
